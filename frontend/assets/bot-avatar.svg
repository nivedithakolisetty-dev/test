<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E75FF" />
      <stop offset="50%" stop-color="#8E52F6" />
      <stop offset="100%" stop-color="#FF5D8F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="40" height="40" rx="12" fill="#1A1E2E" />
  <rect width="40" height="40" rx="12" stroke="url(#geminiGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Gemini 4-pointed sparkle -->
  <path d="M20 7 C20 14, 26 20, 33 20 C26 20, 20 26, 20 33 C20 26, 14 20, 7 20 C14 20, 20 14, 20 7 Z" fill="url(#geminiGrad)" filter="url(#glow)"/>
  <circle cx="20" cy="20" r="2.5" fill="#FFFFFF" />
</svg>
